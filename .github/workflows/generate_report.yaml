---
name: Generate report
on:
  schedule:
    - cron: '00 9 * * *'  # generate report everyday at 9:00 UTC
  push:
  workflow_dispatch:

jobs:
  generate-report:
    name: Generate report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Checkout Upstream Repo
        uses: actions/checkout@v5
        with:
          repository: zukaitis/investment-tracker
          ref: release
          path: upstream
      - name: Install python packages
        run: pip3 install -r ./upstream/requirements.txt
      - name: Set input file directory
        id: set_input_dir
        run: |
          count=`ls -1 *.yaml 2>/dev/null | wc -l`
          if [ $count != 0 ]; then
            echo "input_dir=." >> $GITHUB_OUTPUT
          else
            echo "input_dir=./examples" >> $GITHUB_OUTPUT
          fi
      - name: Generate report
        run: ./upstream/generate_report.py --input_dir ${{ steps.set_input_dir.outputs.input_dir }}
      - name: Get date
        id: get_date
        run: echo "date=$(date -I)" >> $GITHUB_OUTPUT
      - name: Get datetime
        id: get_datetime
        run: echo "datetime=$(date '+%F %T')" >> $GITHUB_OUTPUT
      - name: Get tag
        id: get_tag
        run: echo "tag=$(date '+%FT%H%M%S')" >> $GITHUB_OUTPUT
      - name: Get report filename
        id: get_report_filename
        run: echo "filename=Report_${{ steps.get_date.outputs.date }}.html" >> $GITHUB_OUTPUT
      - name: Rename report
        run: mv ./report.html ${{ steps.get_report_filename.outputs.filename }}
      - name: Delete older releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
            keep_latest: 6  # specify how many old releases you want to keep here
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Report ${{ steps.get_datetime.outputs.datetime }}
          draft: false
          prerelease: false
          files: ${{ steps.get_report_filename.outputs.filename }}
